name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Unit tests, live training smoke test and committed result integrity
        run: python -m pytest -q
